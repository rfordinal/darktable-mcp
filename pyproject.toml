[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "darktable-mcp"
version = "1.0.14"
description = "MCP server bridging an AI assistant into a live darktable session for collaborative RAW editing, masking, and library management"
authors = [{name = "w1ne", email = "14119286+w1ne@users.noreply.github.com"}]
maintainers = [{name = "Roman Fordinal", email = "roman.fordinal@comsultia.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["darktable", "mcp", "model-context-protocol", "photo-editing", "photography"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    # Zero-install mask_object fallback (darktable_mcp/tools/local_segment.py):
    # OpenCV GrabCut + numpy, bundled in this package's own venv so no
    # separate install is needed for a rough segmentation to work -- see
    # segmentation_tools.py's module docstring for the SAM2-sidecar-first,
    # GrabCut-fallback selection order.
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
vision = [
    "rawpy>=0.19",
    "Pillow>=10.0",
    "pyexiv2>=2.12",
]

[project.urls]
Homepage = "https://github.com/rfordinal/darktable-mcp"
Repository = "https://github.com/rfordinal/darktable-mcp"
Issues = "https://github.com/rfordinal/darktable-mcp/issues"
Upstream = "https://github.com/w1ne/darktable-mcp"

[project.scripts]
darktable-mcp = "darktable_mcp:main"

[tool.setuptools.packages.find]
include = ["darktable_mcp*"]

[tool.setuptools.package-data]
darktable_mcp = ["lua/*.lua", "sidecar_assets/*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.8"
strict = true
