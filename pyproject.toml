[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "darktable-mcp"
version = "1.0.35"
description = "MCP server bridging an AI assistant into a live darktable session for collaborative RAW editing, masking, and library management"
authors = [{name = "w1ne", email = "14119286+w1ne@users.noreply.github.com"}]
maintainers = [{name = "Roman Fordinal", email = "roman.fordinal@comsultia.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["darktable", "mcp", "model-context-protocol", "photo-editing", "photography"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Pinned to the 1.x major (2026-07-31 incident): build-deb-mcp.sh installs
    # via plain `pip install /work/src` inside a fresh container, which
    # resolves this spec directly from PyPI and does NOT honor uv.lock's
    # pinned 1.28.1 -- an unbounded "mcp>=1.0.0" here silently pulled
    # mcp==2.0.0 on a real desktop install and crashed at startup with
    # "'Server' object has no attribute 'list_tools'": mcp 2.0.0's Server
    # class dropped list_tools/call_tool entirely (confirmed by installing
    # both versions fresh and inspecting dir(Server(...))) -- a real
    # major-version breaking change upstream, not a bug in this package's
    # own code. Keep this upper bound until the code is migrated to
    # whatever mcp 2.x's replacement API is, and bump deliberately, not by
    # a lockfile going stale.
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    # Zero-install mask_object fallback (darktable_mcp/tools/local_segment.py):
    # OpenCV GrabCut + numpy, bundled in this package's own venv so no
    # separate install is needed for a rough segmentation to work -- see
    # segmentation_tools.py's module docstring for the SAM2-sidecar-first,
    # GrabCut-fallback selection order.
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.24,<3",
    # extract_previews / apply_ratings_batch (preview_tools.py) are unconditionally
    # registered MCP tools, not opt-in -- their deps must always be installed.
    # NOTE: the real deploy target is the .deb (packaging-deb/build-deb-mcp.sh),
    # whose venv is built fresh inside a ubuntu:24.04 "noble" docker container
    # (glibc 2.39) -- do NOT cap these versions for an older host's glibc; that
    # breaks pip resolution inside the noble build container (see CLAUDE.md
    # "extract_previews" entry for the story of getting this wrong once).
    "rawpy>=0.19",
    "Pillow>=10.0",
    "pyexiv2>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/rfordinal/darktable-mcp"
Repository = "https://github.com/rfordinal/darktable-mcp"
Issues = "https://github.com/rfordinal/darktable-mcp/issues"
Upstream = "https://github.com/w1ne/darktable-mcp"

[project.scripts]
darktable-mcp = "darktable_mcp:main"

[tool.setuptools.packages.find]
include = ["darktable_mcp*"]

[tool.setuptools.package-data]
darktable_mcp = ["lua/*.lua", "sidecar_assets/*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.8"
strict = true
